name: aeproject

profile: aeproject

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  aeproject:
    +static_analysis: strict
    
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view

    marts:
      +materialized: table

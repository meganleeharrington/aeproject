version: 2

models:
  - name: dim_station
    description: "One row per network-station"
    columns: 
      - name: station_key
        data_tests:
          - not_null
          - unique
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - network_code
              - station_code
  
  - name: fct_earthquake_events
    description: "One row per earthquake"
    columns:
      - name: earthquake_id
        tests:
          - unique
          - not_null
      - name: flinn_engdahl_region_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seismic_region')
                field: flinn_engdahl_region_number

  - name: dim_seismic_region
    description: "One row per Flinn-Engdahl region"
    columns:
      - name: flinn_engdahl_region_number
        tests:
          - unique
          - not_null
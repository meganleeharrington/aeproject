version: 2

models:
  - name: stg_earthquake_events
    description: "One row per earthquake"
    columns:
      - name: earthquake_id
        data_tests:
          - not_null
          - unique
  
  - name: stg_eia_plants
    description: "One row per plant from EIA-860 2025"
    columns:
      - name: plant_code
        description: "Identifier for each power plant"
        data_tests:
          - unique
          - not_null

  - name: stg_eia_generators
    description: "One row per generator from EIA-860 2025"
    columns:
      - name: plant_code
        description: "Identifier of the plant associated with generator"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_eia_plants')
                field: plant_code
      - name: generator_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plant_code
              - generator_id

  - name: stg_station_details
    description: "One row per network-station"
    columns:
      - name: network
        data_tests:
          - not_null
      - name: station
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - network
              - station

  - name: stg_earthquake_geographic_enrichment
    description: "One row per earthquake"
    columns:
      - name: earthquake_id
        data_tests:
          - not_null
          - unique
      - name: flinn_engdahl_region_number
        data_tests:
          - not_null
      - name: flinn_engdahl_region_name
        data_tests:
          - not_null